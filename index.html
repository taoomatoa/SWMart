 <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Keuangan</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    .card-stat {
      border: none;
      border-radius: 12px;
      transition: transform 0.2s;
    }
    .card-stat:hover {
      transform: translateY(-3px);
    }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }
    .table-card, .chart-card, .form-card {
      border: none;
      border-radius: 12px;
    }
    .badge-category {
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="fa-solid fa-wallet text-warning me-2"></i>KeuanganKu
      </a>
      <span class="navbar-text text-light small">
        <i class="fa-brands fa-telegram text-info me-1"></i> Bot Terhubung
      </span>
    </div>
  </nav>

  <div class="container mb-5">
    
    <!-- 1. RINGKASAN KARTU STATISTIK -->
    <div class="row g-3 mb-4">
      <!-- Total Saldo -->
      <div class="col-md-4">
        <div class="card card-stat shadow-sm p-3 bg-white">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <span class="text-muted small fw-semibold">TOTAL SALDO</span>
              <h3 class="fw-bold mt-1 mb-0 text-dark" id="txtTotalSaldo">Rp 0</h3>
            </div>
            <div class="stat-icon bg-primary bg-opacity-10 text-primary">
              <i class="fa-solid fa-vault"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Total Pemasukan -->
      <div class="col-md-4">
        <div class="card card-stat shadow-sm p-3 bg-white">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <span class="text-muted small fw-semibold">TOTAL PEMASUKAN</span>
              <h3 class="fw-bold mt-1 mb-0 text-success" id="txtTotalPemasukan">Rp 0</h3>
            </div>
            <div class="stat-icon bg-success bg-opacity-10 text-success">
              <i class="fa-solid fa-arrow-down-left"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Total Pengeluaran -->
      <div class="col-md-4">
        <div class="card card-stat shadow-sm p-3 bg-white">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <span class="text-muted small fw-semibold">TOTAL PENGELUARAN</span>
              <h3 class="fw-bold mt-1 mb-0 text-danger" id="txtTotalPengeluaran">Rp 0</h3>
            </div>
            <div class="stat-icon bg-danger bg-opacity-10 text-danger">
              <i class="fa-solid fa-arrow-up-right"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      
      <!-- 2. FORM INPUT TRANSAKSI -->
      <div class="col-lg-4">
        <div class="card form-card shadow-sm p-4 bg-white">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-pen-to-square me-2 text-primary"></i>Tambah Transaksi</h5>
          
          <form id="financeForm">
            <div class="mb-3">
              <label class="form-label small fw-bold">Tanggal</label>
              <input type="date" id="tanggal" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Jenis Transaksi</label>
              <select id="jenis" class="form-select" required>
                <option value="Pengeluaran">Pengeluaran</option>
                <option value="Pemasukan">Pemasukan</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Kategori</label>
              <input type="text" id="kategori" class="form-control" placeholder="Contoh: Makanan, Gaji, Transport" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Nominal (Rp)</label>
              <input type="number" id="nominal" class="form-control" placeholder="0" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Keterangan</label>
              <input type="text" id="keterangan" class="form-control" placeholder="Catatan singkat (Opsional)">
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-primary w-100 fw-bold py-2">
              <i class="fa-solid fa-floppy-disk me-1"></i> Simpan Transaksi
            </button>
          </form>

          <div id="statusAlert" class="mt-3"></div>
        </div>
      </div>

      <!-- 3. GRAFIK & TABEL RIWAYAT TRANSAKSI -->
      <div class="col-lg-8">
        
        <!-- Grafik Visualisasi -->
        <div class="card chart-card shadow-sm p-3 bg-white mb-4">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-chart-pie me-2 text-primary"></i>Ringkasan Keuangan</h5>
          <div style="height: 220px;">
            <canvas id="financeChart"></canvas>
          </div>
        </div>

        <!-- Tabel Transaksi Terakhir -->
        <div class="card table-card shadow-sm p-3 bg-white">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="fa-solid fa-clock-rotate-left me-2 text-primary"></i>Riwayat Transaksi</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="loadData()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Tanggal</th>
                  <th>Jenis</th>
                  <th>Kategori</th>
                  <th>Nominal</th>
                  <th>Keterangan</th>
                </tr>
              </thead>
              <tbody id="transactionTableBody">
                <tr>
                  <td colspan="5" class="text-center text-muted py-3">Memuat data...</td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>

      </div>

    </div>
  </div>

  <!-- JavaScript Logika -->
  <script>
    // Ganti dengan URL Deploy Web App Google Apps Script kamu
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvsgPcUzeWmtD8CvukRfz8hLmIoCtdL5P4nv6IlKQNp79O414J0P2jcjva-lNfK_E/exec";

    let chartInstance = null;

    // Set tanggal default ke hari ini
    document.getElementById('tanggal').valueAsDate = new Date();

    // Jalankan pertama kali
    document.addEventListener("DOMContentLoaded", () => {
      initChart();
      loadData();
    });

    // Inisialisasi Grafik Donut
    function initChart(pemasukan = 0, pengeluaran = 0) {
      const ctx = document.getElementById('financeChart').getContext('2d');
      
      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Pemasukan', 'Pengeluaran'],
          datasets: [{
            data: [pemasukan, pengeluaran],
            backgroundColor: ['#198754', '#dc3545'],
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    // Mengambil Data dari Google Sheets via GAS
    function loadData() {
      fetch(SCRIPT_URL + "?action=read")
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            renderDashboard(data.data);
          }
        })
        .catch(err => console.error("Gagal mengambil data:", err));
    }

    // Merender Data ke Dashboard
    function renderDashboard(data) {
      let totalPemasukan = 0;
      let totalPengeluaran = 0;
      const tbody = document.getElementById('transactionTableBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Belum ada transaksi.</td></tr>';
        return;
      }

      // Tampilkan 10 transaksi terakhir (dibalik urutannya)
      const recentData = [...data].reverse().slice(0, 10);

      recentData.forEach(row => {
        const masukan = parseFloat(row.pemasukan) || 0;
        const keluaran = parseFloat(row.pengeluaran) || 0;

        totalPemasukan += parseFloat(row.pemasukan) || 0;
        totalPengeluaran += parseFloat(row.pengeluaran) || 0;

        const isMasuk = row.jenis === "Pemasukan";
        const nominalStr = isMasuk 
          ? `<span class="text-success fw-bold">+Rp ${masukan.toLocaleString('id-ID')}</span>` 
          : `<span class="text-danger fw-bold">-Rp ${keluaran.toLocaleString('id-ID')}</span>`;

        const badgeClass = isMasuk ? "bg-success" : "bg-danger";

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.tanggal}</td>
          <td><span class="badge ${badgeClass}">${row.jenis}</span></td>
          <td><span class="badge bg-secondary badge-category">${row.kategori}</span></td>
          <td>${nominalStr}</td>
          <td class="text-muted small">${row.keterangan || '-'}</td>
        `;
        tbody.appendChild(tr);
      });

      // Hitung total dari seluruh data
      let sumPemasukan = 0;
      let sumPengeluaran = 0;
      data.forEach(row => {
        sumPemasukan += parseFloat(row.pemasukan) || 0;
        sumPengeluaran += parseFloat(row.pengeluaran) || 0;
      });

      const totalSaldo = sumPemasukan - sumPengeluaran;

      // Update Angka di Kartu Stat
      document.getElementById('txtTotalSaldo').innerText = "Rp " + totalSaldo.toLocaleString('id-ID');
      document.getElementById('txtTotalPemasukan').innerText = "Rp " + sumPemasukan.toLocaleString('id-ID');
      document.getElementById('txtTotalPengeluaran').innerText = "Rp " + sumPengeluaran.toLocaleString('id-ID');

      // Update Grafik
      initChart(sumPemasukan, sumPengeluaran);
    }

    // Submit Form Transaksi
    document.getElementById('financeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      const alertDiv = document.getElementById('statusAlert');
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Menyimpan...';
      alertDiv.innerHTML = '';

      const payload = {
        tanggal: document.getElementById('tanggal').value,
        jenis: document.getElementById('jenis').value,
        kategori: document.getElementById('kategori').value,
        nominal: document.getElementById('nominal').value,
        keterangan: document.getElementById('keterangan').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === "success") {
          alertDiv.innerHTML = '<div class="alert alert-success p-2 small text-center mb-0">Transaksi Berhasil Disimpan!</div>';
          document.getElementById('financeForm').reset();
          document.getElementById('tanggal').valueAsDate = new Date();
          loadData(); // Reload data & grafik
        } else {
          alertDiv.innerHTML = `<div class="alert alert-danger p-2 small text-center mb-0">Gagal: ${data.message}</div>`;
        }
      })
      .catch(err => {
        alertDiv.innerHTML = '<div class="alert alert-danger p-2 small text-center mb-0">Koneksi Error!</div>';
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Simpan Transaksi';
      });
    });
  </script>
</body>
</html>
