<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Keuangan</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    .card-stat {
      border: none;
      border-radius: 12px;
      transition: transform 0.2s;
    }
    .card-stat:hover {
      transform: translateY(-3px);
    }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }
    .table-card, .chart-card, .form-card, .filter-card {
      border: none;
      border-radius: 12px;
    }
    .badge-category {
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="fa-solid fa-wallet text-warning me-2"></i>KeuanganKu
      </a>
      <span class="navbar-text text-light small">
        <i class="fa-brands fa-telegram text-info me-1"></i> Bot Terhubung
      </span>
    </div>
  </nav>

  <div class="container mb-5">

    <!-- BAR FILTER BULAN & TAHUN -->
    <div class="card filter-card shadow-sm p-3 bg-white mb-4">
      <div class="row align-items-center g-2">
        <div class="col-md-3">
          <h6 class="fw-bold mb-0 text-dark">
            <i class="fa-solid fa-filter text-primary me-2"></i>Filter Periode:
          </h6>
        </div>
        <div class="col-md-3">
          <select id="filterBulan" class="form-select form-select-sm" onchange="applyFilter()">
            <option value="ALL">Semua Bulan</option>
            <option value="01">Januari</option>
            <option value="02">Februari</option>
            <option value="03">Maret</option>
            <option value="04">April</option>
            <option value="05">Mei</option>
            <option value="06">Juni</option>
            <option value="07">Juli</option>
            <option value="08">Agustus</option>
            <option value="09">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="filterTahun" class="form-select form-select-sm" onchange="applyFilter()">
            <!-- Pilihan tahun diisi otomatis lewat JS -->
          </select>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary w-100" onclick="resetFilter()">
            <i class="fa-solid fa-rotate-left me-1"></i> Reset / Semua
          </button>
          <button class="btn btn-sm btn-outline-secondary" onclick="loadData()" title="Segarkan Data">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- KARTU SALDO AKUMULASI (Ukuran Besar & Jelas) -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="card shadow-sm border-0 bg-primary text-white p-4 rounded-3">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <span class="text-white-50 fw-semibold text-uppercase tracking-wider fs-6">
                <i class="fa-solid fa-wallet me-2"></i>Total Saldo Akumulasi
              </span>
              <h1 id="totalSaldo" class="display-4 fw-bold mb-0 mt-1">Rp 0</h1>
            </div>
            <div class="bg-white bg-opacity-25 p-3 rounded-circle d-none d-sm-block">
              <i class="fa-solid fa-scale-balanced fa-2x text-white"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 1. KARTU RINGKASAN STATISTIK PERIODE -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card card-stat shadow-sm p-3 bg-white">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <span class="text-muted small fw-semibold">SALDO PERIODE INI</span>
              <h3 class="fw-bold mt-1 mb-0 text-dark" id="txtTotalSaldo">Rp 0</h3>
            </div>
            <div class="stat-icon bg-primary bg-opacity-10 text-primary">
              <i class="fa-solid fa-vault"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card card-stat shadow-sm p-3 bg-white">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <span class="text-muted small fw-semibold">TOTAL PEMASUKAN</span>
              <h3 class="fw-bold mt-1 mb-0 text-success" id="txtTotalPemasukan">Rp 0</h3>
            </div>
            <div class="stat-icon bg-success bg-opacity-10 text-success">
              <i class="fa-solid fa-arrow-down-left"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card card-stat shadow-sm p-3 bg-white">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <span class="text-muted small fw-semibold">TOTAL PENGELUARAN</span>
              <h3 class="fw-bold mt-1 mb-0 text-danger" id="txtTotalPengeluaran">Rp 0</h3>
            </div>
            <div class="stat-icon bg-danger bg-opacity-10 text-danger">
              <i class="fa-solid fa-arrow-up-right"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      
      <!-- 2. FORM INPUT TRANSAKSI -->
      <div class="col-lg-4">
        <div class="card form-card shadow-sm p-4 bg-white">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-pen-to-square me-2 text-primary"></i>Tambah Transaksi</h5>
          
          <form id="financeForm">
            <div class="mb-3">
              <label class="form-label small fw-bold">Tanggal</label>
              <input type="date" id="tanggal" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Jenis Transaksi</label>
              <select id="jenis" class="form-select" onchange="updateCategoryOptions()" required>
                <option value="Pengeluaran">Pengeluaran</option>
                <option value="Pemasukan">Pemasukan</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Kategori</label>
              <select id="kategori" class="form-select" required></select>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Nominal (Rp)</label>
              <input type="number" id="nominal" class="form-control" placeholder="0" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Keterangan</label>
              <input type="text" id="keterangan" class="form-control" placeholder="Catatan singkat (Opsional)">
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-primary w-100 fw-bold py-2">
              <i class="fa-solid fa-floppy-disk me-1"></i> Simpan Transaksi
            </button>
          </form>

          <div id="statusAlert" class="mt-3"></div>
        </div>
      </div>

      <!-- 3. GRAFIK & TABEL RIWAYAT TRANSAKSI -->
      <div class="col-lg-8">
        <!-- Grafik Visualisasi -->
        <div class="card chart-card shadow-sm p-3 bg-white mb-4">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-chart-pie me-2 text-primary"></i>Ringkasan Grafik Periode</h5>
          <div style="height: 220px;">
            <canvas id="financeChart"></canvas>
          </div>
        </div>
      
        <!-- Tabel Transaksi Terakhir (Maksimal 5) -->
        <div class="card table-card shadow-sm p-3 bg-white">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="fa-solid fa-clock-rotate-left me-2 text-primary"></i>Riwayat Transaksi (5 Terakhir)</h5>
            <span id="transCount" class="badge bg-light text-dark border">0 Transaksi</span>
          </div>
        
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Tanggal</th>
                  <th>Jenis</th>
                  <th>Kategori</th>
                  <th>Nominal</th>
                  <th>Keterangan</th>
                </tr>
              </thead>
              <tbody id="transactionTableBody">
                <tr>
                  <td colspan="5" class="text-center text-muted py-3">Memuat data...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript Logika -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvsgPcUzeWmtD8CvukRfz8hLmIoCtdL5P4nv6IlKQNp79O414J0P2jcjva-lNfK_E/exec";

    let allTransactions = [];
    let chartInstance = null;

    const categoriesList = {
      Pengeluaran: [
        "Logisitik Harian", "Gaji Kasir", "Indogrosir", "Toko Erwin", "Sosro", 
        "You C", "Sari Roti", "Snak Widia", "Hidro Coco", "Pocari Sweat", 
        "Larutan Kino", "Coca Cola", "Milki Way", "Aqua Kemasan", "Aqua Galon", 
        "Nestle Kemasan", "Alice", "Cimori", "Nii Grentea", "Snack Acmad", 
        "Snak Musri", "wong Coco", "Jelly 98", "Jelly Andri", "Transportasi", 
        "Sales Rokok", "Lain-Lain"
      ],
      Pemasukan: [
        "Penjualan Harian", "Kasbon Anggota", "Pembayaran Harian"
      ]
    };

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('tanggal').valueAsDate = new Date();
      setupYearOptions();
      updateCategoryOptions();
      initChart();
      loadData();
    });

    // Helper untuk membersihkan nilai angka dari Google Sheets
    function parseNumber(val) {
      if (val === undefined || val === null || val === '') return 0;
      if (typeof val === 'number') return val;
      const strVal = val.toString().replace(/[^0-9.-]+/g, "");
      return parseFloat(strVal) || 0;
    }

    // Menghitung Saldo Akumulasi Keseluruhan (Membaca Kolom D & E)
    function hitungSaldoAkumulasi(transactions) {
      const totalSaldoElement = document.getElementById('totalSaldo');
      
      if (!Array.isArray(transactions) || transactions.length === 0) {
        totalSaldoElement.textContent = 'Rp 0';
        return;
      }

      const saldoTotal = transactions.reduce((total, trx) => {
        // Kolom D = Pemasukan, Kolom E = Pengeluaran
        const masuk = parseNumber(trx.pemasukan !== undefined ? trx.pemasukan : trx.masuk);
        const keluar = parseNumber(trx.pengeluaran !== undefined ? trx.pengeluaran : trx.keluar);

        // Jika data dikirim berupa `nominal` & `jenis`
        if (masuk === 0 && keluar === 0 && trx.nominal !== undefined) {
          const nominal = parseNumber(trx.nominal);
          const jenis = (trx.jenis || '').toString().toLowerCase().trim();
          if (jenis === 'pemasukan') return total + nominal;
          if (jenis === 'pengeluaran') return total - nominal;
        }

        return total + masuk - keluar;
      }, 0);

      totalSaldoElement.textContent = `Rp ${saldoTotal.toLocaleString('id-ID')}`;
    }

    // Render Dashboard (Tabel 5 Terakhir & Statistik Periode)
    function renderDashboard(data) {
      const tbody = document.getElementById('transactionTableBody');
      const transCount = document.getElementById('transCount');
      
      // Update Saldo Akumulasi Seluruh Data
      hitungSaldoAkumulasi(allTransactions);

      transCount.innerText = `${data.length} Transaksi`;

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Tidak ada transaksi pada periode ini.</td></tr>';
        document.getElementById('txtTotalSaldo').innerText = "Rp 0";
        document.getElementById('txtTotalPemasukan').innerText = "Rp 0";
        document.getElementById('txtTotalPengeluaran').innerText = "Rp 0";
        initChart(0, 0);
        return;
      }

      let sumPemasukan = 0;
      let sumPengeluaran = 0;

      data.forEach(row => {
        let masuk = parseNumber(row.pemasukan !== undefined ? row.pemasukan : row.masuk);
        let keluar = parseNumber(row.pengeluaran !== undefined ? row.pengeluaran : row.keluar);

        // Fallback jika Google Sheets mengembalikan gabungan nominal & jenis
        if (masuk === 0 && keluar === 0 && row.nominal !== undefined) {
          const nominal = parseNumber(row.nominal);
          const jenis = (row.jenis || '').toLowerCase().trim();
          if (jenis === 'pemasukan') masuk = nominal;
          else if (jenis === 'pengeluaran') keluar = nominal;
        }

        sumPemasukan += masuk;
        sumPengeluaran += keluar;
      });

      const saldoPeriode = sumPemasukan - sumPengeluaran;

      // Update Statistik Tampilan Periode
      document.getElementById('txtTotalSaldo').innerText = "Rp " + saldoPeriode.toLocaleString('id-ID');
      document.getElementById('txtTotalPemasukan').innerText = "Rp " + sumPemasukan.toLocaleString('id-ID');
      document.getElementById('txtTotalPengeluaran').innerText = "Rp " + sumPengeluaran.toLocaleString('id-ID');

      // Update Grafik
      initChart(sumPemasukan, sumPengeluaran);

      // Urutkan transaksi terbaru
      const sortedData = [...data].reverse();

      // BATASI HANYA 5 TRANSAKSI TERAKHIR
      const recentData = sortedData.slice(0, 5);

      // Render ke Tabel
      tbody.innerHTML = recentData.map((row) => {
        let masuk = parseNumber(row.pemasukan !== undefined ? row.pemasukan : row.masuk);
        let keluar = parseNumber(row.pengeluaran !== undefined ? row.pengeluaran : row.keluar);
        
        let jenisStr = row.jenis;
        let nominalStr = "";
        let badgeClass = "bg-secondary";

        if (masuk > 0 || (row.jenis || '').toLowerCase() === 'pemasukan') {
          jenisStr = "Pemasukan";
          const val = masuk > 0 ? masuk : parseNumber(row.nominal);
          nominalStr = `<span class="text-success fw-bold">+Rp ${val.toLocaleString('id-ID')}</span>`;
          badgeClass = "bg-success";
        } else {
          jenisStr = "Pengeluaran";
          const val = keluar > 0 ? keluar : parseNumber(row.nominal);
          nominalStr = `<span class="text-danger fw-bold">-Rp ${val.toLocaleString('id-ID')}</span>`;
          badgeClass = "bg-danger";
        }

        return `
          <tr>
            <td>${row.tanggal || '-'}</td>
            <td><span class="badge ${badgeClass}">${jenisStr}</span></td>
            <td><span class="badge bg-secondary badge-category">${row.kategori || '-'}</span></td>
            <td>${nominalStr}</td>
            <td class="text-muted small">${row.keterangan || '-'}</td>
          </tr>
        `;
      }).join('');
    }

    function loadData() {
      fetch(SCRIPT_URL + "?action=read")
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            allTransactions = data.data;
            applyFilter();
          }
        })
        .catch(err => console.error("Gagal mengambil data:", err));
    }

    function applyFilter() {
      const selectedMonth = document.getElementById('filterBulan').value;
      const selectedYear = document.getElementById('filterTahun').value;

      const filtered = allTransactions.filter(item => {
        if (!item.tanggal) return false;

        const parts = item.tanggal.split('-');
        const itemYear = parts[0];
        const itemMonth = parts[1];

        const matchMonth = (selectedMonth === 'ALL' || itemMonth === selectedMonth);
        const matchYear = (selectedYear === 'ALL' || itemYear === selectedYear);

        return matchMonth && matchYear;
      });

      renderDashboard(filtered);
    }

    function resetFilter() {
      document.getElementById('filterBulan').value = 'ALL';
      document.getElementById('filterTahun').value = 'ALL';
      applyFilter();
    }

    function setupYearOptions() {
      const yearSelect = document.getElementById('filterTahun');
      const currentYear = new Date().getFullYear();
      yearSelect.innerHTML = '<option value="ALL">Semua Tahun</option>';

      for (let y = currentYear + 1; y >= currentYear - 3; y--) {
        const opt = document.createElement('option');
        opt.value = y.toString();
        opt.innerText = y.toString();
        yearSelect.appendChild(opt);
      }
    }

    function updateCategoryOptions() {
      const jenisSelect = document.getElementById('jenis').value;
      const kategoriSelect = document.getElementById('kategori');
      kategoriSelect.innerHTML = '';

      const options = categoriesList[jenisSelect] || [];
      options.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.innerText = cat;
        kategoriSelect.appendChild(opt);
      });
    }

    function initChart(pemasukan = 0, pengeluaran = 0) {
      const ctx = document.getElementById('financeChart').getContext('2d');
      
      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Pemasukan', 'Pengeluaran'],
          datasets: [{
            data: [pemasukan, pengeluaran],
            backgroundColor: ['#198754', '#dc3545'],
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    // Submit Form
    document.getElementById('financeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      const alertDiv = document.getElementById('statusAlert');
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Menyimpan...';
      alertDiv.innerHTML = '';

      const payload = {
        tanggal: document.getElementById('tanggal').value,
        jenis: document.getElementById('jenis').value,
        kategori: document.getElementById('kategori').value,
        nominal: document.getElementById('nominal').value,
        keterangan: document.getElementById('keterangan').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === "success") {
          alertDiv.innerHTML = '<div class="alert alert-success p-2 small text-center mb-0">Transaksi Berhasil Disimpan!</div>';
          document.getElementById('financeForm').reset();
          document.getElementById('tanggal').valueAsDate = new Date();
          updateCategoryOptions();
          loadData();
        } else {
          alertDiv.innerHTML = `<div class="alert alert-danger p-2 small text-center mb-0">Gagal: ${data.message}</div>`;
        }
      })
      .catch(err => {
        alertDiv.innerHTML = '<div class="alert alert-danger p-2 small text-center mb-0">Koneksi Error!</div>';
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Simpan Transaksi';
      });
    });
  </script>
</body>
</html>
